name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a ejecutar (opcional). Ej: @smoke, @ui, @api, @UI-03. Vacío = suite completa'
        required: false
        default: ''
        type: string

# Si llega un nuevo push a la misma rama, cancela la ejecución anterior
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend (chromium, firefox) + Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck y lint
        run: npm run check

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox

      - name: Ejecutar la suite
        # El tag llega por variable de entorno (no interpolado en el script) para evitar inyección de comandos.
        # Las URLs y usuarios se leen de env/.env.qa; para credenciales privadas se añadirían aquí desde secrets,
        # p. ej. SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "### Ejecución filtrada por tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            npx playwright test --grep "$TAG"
          else
            echo "### Ejecución de la suite completa" >> "$GITHUB_STEP_SUMMARY"
            npx playwright test
          fi

      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar trazas de fallos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7